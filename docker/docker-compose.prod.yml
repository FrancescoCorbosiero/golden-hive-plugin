# Production stack — Contabo VPS (or any single-host Docker engine).
#
# Usage on the VPS:
#   git clone <repo> /opt/golden-hive && cd /opt/golden-hive
#   cp docker/.env.prod.example docker/.env.prod && $EDITOR docker/.env.prod
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
#
# Caddy fronts the WP container and obtains/renews Let's Encrypt certs
# automatically. Make sure the A record for ${SITE_DOMAIN} points to the
# VPS IP and that ports 80/443 are open in Contabo's firewall before
# bringing the stack up.

name: golden-hive-prod

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-allowed-packet=64M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
      MARIADB_DATABASE:      ${DB_NAME:?set DB_NAME in .env.prod}
      MARIADB_USER:          ${DB_USER:?set DB_USER in .env.prod}
      MARIADB_PASSWORD:      ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  wordpress:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    image: golden-hive:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST:      db:3306
      WORDPRESS_DB_NAME:      ${DB_NAME}
      WORDPRESS_DB_USER:      ${DB_USER}
      WORDPRESS_DB_PASSWORD:  ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME',    'https://${SITE_DOMAIN}' );
        define( 'WP_SITEURL', 'https://${SITE_DOMAIN}' );
        define( 'WP_ENVIRONMENT_TYPE', 'production' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_AUTO_UPDATE_CORE', 'minor' );
        define( 'FORCE_SSL_ADMIN', true );
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_core:/var/www/html
    networks: [internal, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.prod}
      ACME_EMAIL:  ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Caddy serves static WP files (uploads, plugin/theme assets)
      # directly without round-tripping through Apache.
      - wp_core:/var/www/html:ro
    networks: [web]

  # Daily DB dump → /backups on the host.
  # Override with `BACKUP_CRON="*/30 * * * *"` etc. via .env.prod.
  db-backup:
    image: mariadb:11
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:          db
      DB_NAME:          ${DB_NAME}
      DB_USER:          root
      DB_PASSWORD:      ${DB_ROOT_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          echo "[backup] dumping at $$ts"
          mariadb-dump -h "$$DB_HOST" -u "$$DB_USER" -p"$$DB_PASSWORD" \
              --single-transaction --quick --routines --triggers "$$DB_NAME" \
              | gzip > "/backups/$$DB_NAME-$$ts.sql.gz"
          find /backups -name "$$DB_NAME-*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks: [internal]

  # Pings wp-cron.php every 60s on the internal network so WP-Cron +
  # WC Action Scheduler + Hive Sync's hsync_5min tick fire reliably
  # without depending on admin page traffic. Hits the WP container
  # directly (not through Caddy) — no TLS round-trip, no public DNS.
  # Required if DISABLE_WP_CRON is set; otherwise the WP cron lock
  # prevents redundant work so leaving it on is harmless.
  wp-cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - wordpress
    entrypoint:
      - sh
      - -c
      - |
        sleep 30
        while true; do
          curl -fsS -o /dev/null --max-time 50 \
            -H "Host: ${SITE_DOMAIN}" \
            "http://wordpress/wp-cron.php?doing_wp_cron=$$(date +%s)" \
            || echo "[wp-cron] ping failed at $$(date -Iseconds)"
          sleep 60
        done
    networks: [internal]

volumes:
  db_data:
  wp_core:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
