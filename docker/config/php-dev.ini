; Golden Hive — dev PHP overrides.
; Loaded as zz-golden-hive.ini so it wins over base WordPress image config.

memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_vars = 10000

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Xdebug 3 — connects back to the host IDE.
; Override XDEBUG_MODE / XDEBUG_CLIENT_HOST via the dev compose env if needed.
xdebug.mode = develop,debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0
xdebug.idekey = GOLDEN_HIVE
